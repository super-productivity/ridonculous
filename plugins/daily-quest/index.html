<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Quest</title>
<!-- Super Productivity styles controls; the map tints itself from the host theme so it also works in dark mode. -->
<style>
html { background: var(--bg, #f6f7f4); }
body { container-type: inline-size; box-sizing: border-box; margin: 0 auto; max-width: 1400px; padding: var(--s2, 16px); background: var(--bg, #f6f7f4); color: var(--text-color, #222); font-family: var(--font-primary-stack, system-ui, sans-serif); }
header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: var(--s, 8px) var(--s2, 16px); margin-bottom: var(--s2, 16px); }
header h1 { margin: 0 0 var(--s-half, 4px); }
header p { margin: 0; }
#progress { display: block; margin-top: var(--s-half, 4px); }
.tools { display: flex; align-items: center; gap: var(--s, 8px); flex-wrap: wrap; }
button { box-sizing: border-box; min-width: 0; min-height: 44px; white-space: normal; overflow-wrap: anywhere; }
button:focus-visible, [role="option"]:focus-visible { outline: 2px solid var(--c-primary, Highlight); outline-offset: 3px; }
#status { display: flex; align-items: center; justify-content: space-between; gap: var(--s2, 16px); margin-bottom: var(--s2, 16px); }
#status-message { min-width: 0; overflow-wrap: anywhere; }
#dismiss-status { flex-shrink: 0; }
[hidden] { display: none !important; }

/* Map */
.map { --land-tint: var(--bg, #f6f7f4); position: relative; isolation: isolate; width: 100%; min-width: 0; aspect-ratio: 2 / 3; min-height: 520px; border-radius: var(--card-border-radius, 8px); border: 1px solid var(--divider-color, #ddd); background: color-mix(in srgb, #d8c89a 12%, var(--land-tint)); }
.landscape, .trails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* The map lets the detail card hang past its edge; only the artwork is clipped. */
.landscape { border-radius: inherit; }
.land { fill: color-mix(in srgb, #6a9c70 24%, var(--land-tint)); }
.water { stroke: color-mix(in srgb, #3d9ad9 30%, var(--land-tint)); }
.peak { fill: color-mix(in srgb, var(--text-color, #222) 10%, var(--land-tint)); }
.peak-shade { fill: color-mix(in srgb, var(--text-color, #222) 17%, var(--land-tint)); }
.crown { fill: color-mix(in srgb, #3f7a4d 48%, var(--land-tint)); }
.trunk, .bridge { stroke: color-mix(in srgb, var(--text-color, #222) 35%, var(--land-tint)); }
.bridge { fill: color-mix(in srgb, #b08a5a 35%, var(--land-tint)); }
.trails { color: var(--text-color-muted, #788397); }
.trails .done { color: var(--color-success, #3c9a5f); }
.trails .branch { opacity: .75; }
/* Waypoints are the boss's subtasks, strung along the trail to it. */
.waypoints { position: absolute; inset: 0; pointer-events: none; }
.waypoint { position: absolute; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--text-color-muted, #888); background: var(--card-bg, #fff); transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; }
.waypoint[data-status="next"] { border-color: var(--c-primary, #1683fa); }
.waypoint[data-status="active"] { border-color: var(--c-primary, #1683fa); background: var(--c-primary, #1683fa); animation: pulse 2s ease-out infinite; }
.waypoint[data-status="complete"] { border-color: var(--color-success, #3c9a5f); background: var(--color-success, #3c9a5f); }
/* The stop layer covers the map; only the stops themselves take clicks so waypoints stay reachable. */
.stops { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; pointer-events: none; }
.stops li { pointer-events: auto; }
.stops li { --orb: 56px; --w: min(8.5rem, 40cqw); position: absolute; width: var(--w); left: clamp(calc(var(--w) / 2), var(--x), calc(100% - var(--w) / 2)); top: var(--y); transform: translate(-50%, calc(var(--orb) / -2)); }
.stops li[data-role="boss"] { --orb: 72px; }
.stops li[data-role="side"] { --orb: 48px; }
/* Portrait route for narrow panels; the landscape route below follows the artwork. */
[data-role="buff"] { --x: 26%; --y: 10%; }
[data-role="side"] { --x: 76%; --y: 30%; }
[data-role="boss"] { --x: 34%; --y: 58%; }
[data-role="recovery"] { --x: 72%; --y: 84%; }
.stop { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; min-height: 0; padding: 0; border: 0; background: none; color: inherit; text-align: center; cursor: pointer; }
.stop:hover, .stop:active { background: none; filter: none; }
.orb { position: relative; display: grid; place-items: center; width: var(--orb); height: var(--orb); border-radius: 50%; border: 2px dashed var(--text-color-muted, #888); background: var(--card-bg, #fff); color: var(--text-color-muted, #888); box-shadow: var(--whiteframe-shadow-2dp, 0 2px 6px rgb(0 0 0 / .18)); transition: transform .15s ease, box-shadow .15s ease; }
.stop:hover .orb { transform: translateY(-2px) scale(1.04); border-color: var(--c-primary, #1683fa); }
.stop[aria-expanded="true"] .orb { box-shadow: 0 0 0 4px var(--bg, #fff), 0 0 0 7px var(--c-primary, #1683fa); }
.stop[data-status="chosen"] .orb { border: 2px solid var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); }
.stop[data-status="active"] .orb { border: 2px solid var(--c-primary, #1683fa); background: var(--c-primary, #1683fa); color: #fff; animation: pulse 2s ease-out infinite; }
.stop[data-status="complete"] .orb { border: 2px solid var(--color-success, #3c9a5f); background: var(--color-success, #3c9a5f); color: #fff; }
.stop[data-status="complete"] .orb::after { content: "✓"; position: absolute; top: -4px; right: -4px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--card-bg, #fff); color: var(--color-success, #3c9a5f); font-size: 13px; font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.step.count { left: auto; right: -4px; top: -4px; bottom: auto; background: var(--c-primary, #1683fa); color: #fff; }
.step { position: absolute; bottom: -4px; left: -4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--text-color, #222); color: var(--bg, #fff); font-size: 11px; font-weight: 700; }
.stop-label { display: flex; flex-direction: column; max-width: 100%; padding: 2px 8px; border-radius: 8px; background: color-mix(in srgb, var(--card-bg, #fff) 85%, transparent); }
.stop-label strong { font-size: .95em; }
.stop-value { max-width: 100%; font-size: .85em; color: var(--text-color-muted, #666); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest-icon { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
/* A short burst when the boss falls; the trail to Recovery lights up at the same time. */
.stop.victory .orb { animation: victory .9s ease-out; }
@keyframes victory { 0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-success, #3c9a5f) 70%, transparent); } 35% { transform: scale(1.18); } 100% { transform: scale(1); box-shadow: 0 0 0 28px transparent; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-primary, #1683fa) 55%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@media (prefers-reduced-motion: reduce) { .orb, .stop.victory .orb, .panel, .waypoint { transition: none; animation: none !important; } }

/* Detail card */
.panel { position: absolute; z-index: 2; box-sizing: border-box; max-width: calc(100% - 24px); margin: 0; box-shadow: 0 10px 32px rgb(0 0 0 / .24); animation: pop .16s ease-out; }
#detail { display: flex; flex-direction: column; gap: 12px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.panel h2, .panel p { margin: 0; }
.detail-head { display: flex; align-items: center; gap: 12px; }
.detail-head > div { flex: 1; min-width: 0; }
.detail-head .orb { --orb: 48px; flex: 0 0 auto; border-style: solid; border-color: var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); box-shadow: none; }
#close-detail { flex: 0 0 auto; width: 44px; padding: 0; font-size: 1.4em; line-height: 1; }
.slot { display: flex; align-items: center; justify-content: space-between; gap: var(--s, 8px); width: 100%; padding: 12px var(--s2, 16px); text-align: left; }
.slot[data-empty="true"] { border: 2px dashed var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); font-weight: 600; }
.slot-text { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.slot-cta { flex: 0 0 auto; font-size: .85em; color: var(--c-primary, #1683fa); }
#act { align-self: flex-start; max-width: 100%; }
.rows { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; margin: 0; padding: 2px; list-style: none; }
.row { display: flex; align-items: center; gap: var(--s, 8px); width: 100%; min-height: 40px; padding: 6px 10px; text-align: left; }
.row:disabled { opacity: 1; }
.camp-item { display: flex; align-items: center; gap: var(--s, 8px); min-width: 0; padding: 2px 2px 2px 10px; border: 1px solid var(--divider-color, #ddd); border-radius: var(--card-border-radius, 8px); }
.camp-item button { flex: 0 0 auto; min-height: 36px; }
.camp-item[data-status="active"] > button:not(.remove) { opacity: 1; border-color: var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); }
.camp-item .remove { width: 36px; padding: 0; font-size: 1.2em; }
.row-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mark { flex: 0 0 1.2em; text-align: center; color: var(--text-color-muted, #888); }
[data-status="active"] > .mark { color: var(--c-primary, #1683fa); }
[data-status="complete"] > .mark { color: var(--color-success, #3c9a5f); font-weight: 700; }
[data-status="complete"] > .row-title { color: var(--text-color-muted, #888); text-decoration: line-through; }
/* Running and done are states, not actions: shown at full strength instead of a faded button. */
#act[data-state="active"] { background: transparent; border: 1px solid var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); opacity: 1; }
#act[data-state="complete"] { background: var(--color-success, #3c9a5f); border-color: var(--color-success, #3c9a5f); opacity: 1; }

/* Picker */
dialog { width: min(560px, calc(100% - 32px)); max-height: 85dvh; padding: 0; color: var(--text-color, #222); background: var(--card-bg, Canvas); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
#picker-form { display: flex; flex-direction: column; max-height: 85dvh; padding: var(--s2, 16px); box-sizing: border-box; }
.picker-head h2 { margin: 0 0 var(--s-half, 4px); }
.picker-head p { margin: 0 0 var(--s2, 16px); }
.picker-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
input { box-sizing: border-box; width: 100%; min-width: 0; min-height: 44px; }
#task-mode { display: flex; flex-direction: column; min-height: 0; flex: 1; }
#task-count { margin: var(--s, 8px) 0 0; font-size: .85em; }
#task-choice { min-height: 0; overflow-y: auto; margin: var(--s, 8px) 0 0; padding: 4px; list-style: none; display: grid; gap: 4px; align-content: start; }
[role="option"] { display: flex; align-items: center; gap: var(--s, 8px); min-height: 44px; padding: 8px 12px; border-radius: var(--card-border-radius, 8px); border: 1px solid transparent; cursor: pointer; }
[role="option"][aria-selected="true"] { background: var(--select-hover-bg, rgb(0 0 0 / .06)); border-color: var(--c-primary, #1683fa); }
.option-text { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.option-meta { font-size: .85em; color: var(--text-color-muted, #666); }
.option-check { flex: 0 0 auto; color: var(--c-primary, #1683fa); font-weight: 700; }
mark { background: color-mix(in srgb, var(--c-primary, #1683fa) 25%, transparent); color: inherit; border-radius: 2px; }
#task-empty { margin: var(--s2, 16px) 0; }
#ritual-mode { min-height: 0; overflow-y: auto; padding: 4px; margin: -4px; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s, 8px); margin: 0 0 var(--s2, 16px); }
.suggestions button { text-align: left; }
.suggestions button[aria-pressed="true"] { border-color: var(--c-primary, #1683fa); color: var(--c-primary, #1683fa); }
#ritual-note { margin: var(--s, 8px) 0 0; font-size: .9em; }
#picker-error { margin: var(--s, 8px) 0 0; color: var(--c-warn, #b00020); }
#picker-error:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s, 8px); padding-top: var(--s2, 16px); flex-shrink: 0; }

@container (min-width: 560px) {
 .map { aspect-ratio: 1200 / 760; min-height: 340px; }
 [data-role="buff"] { --x: 12%; --y: 28%; }
 [data-role="side"] { --x: 36%; --y: 76%; }
 [data-role="boss"] { --x: 64%; --y: 28%; }
 [data-role="recovery"] { --x: 87%; --y: 66%; }
}
@media (max-width: 600px) {
 dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 16px 16px 0 0; }
}
@media (max-width: 360px) { .suggestions { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>

 <li data-role="recovery"><button class="stop" id="node-recovery" aria-expanded="false" aria-controls="panel"><span class="orb"><svg class="quest-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c4 10-8 11-6 19 5-1 7-5 8-9 13 16 4 23-3 23-15 0-14-15-7-20M9 39l30 8M39 39 9 47"/></svg><span class="step">3</span></span><span class="stop-label"><strong>Recovery</strong><span class="stop-value"></span></span></button></li>

 <section id="detail" aria-labelledby="detail-title">

  <button class="slot" id="choice" aria-haspopup="dialog"><span class="slot-text" id="choice-text"></span><span class="slot-cta" id="choice-cta" aria-hidden="true"></span></button>
  <p class="text-muted" id="detail-hint"></p>
  <small class="text-muted" id="steps-summary" hidden></small>
  <ol class="rows" id="steps" aria-labelledby="steps-summary" hidden></ol>
  <ul class="rows" id="camp" aria-label="Stashed side quests" hidden></ul>
  <small class="text-muted" id="attempts" hidden></small>
  <button class="btn-primary" id="act"></button>
 </section>
</aside>
</main>
<dialog class="card" id="picker" aria-labelledby="picker-title">
<form id="picker-form">
 <div class="picker-head"><h2 id="picker-title"></h2><p class="text-muted" id="picker-help"></p></div>
 <div class="picker-body">
  <div id="task-mode">
   <input id="task-search" type="search" role="combobox" aria-label="Search tasks" aria-autocomplete="list" aria-expanded="true" aria-controls="task-choice" placeholder="Search tasks…" autocomplete="off">
   <p class="text-muted" id="task-count" aria-live="polite"></p>
   <ul id="task-choice" role="listbox" aria-label="Unfinished tasks"></ul>
   <p class="text-muted" id="task-empty" hidden></p>
  </div>
  <div id="ritual-mode">
   <div id="suggestions" class="suggestions" role="group" aria-label="Suggested activities"></div>
   <label for="ritual">Or make it your own</label>
   <input id="ritual" maxlength="100" autocomplete="off">
   <p class="text-muted" id="ritual-note">Checking this off leaves your task timer running.</p>
  </div>
  <p id="picker-error" role="alert"></p>
 </div>
 <div class="actions"><button type="button" id="cancel">Cancel</button><button class="btn-primary" type="submit" id="save">Save</button></div>
</form>
</dialog>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const demo = !window.PluginAPI && window.parent === window;
const roles = {

function curve(a, b, bend) {

 return t => ({ x: (1 - t) ** 2 * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) ** 2 * a.y + 2 * (1 - t) * t * c.y + t * t * b.y });
}
function trailPath(point, from, to, attributes) {
 const points = Array.from({ length: 17 }, (_, i) => point(from + (to - from) * i / 16));
 return `<path ${attributes} d="M${points.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L')}" fill="none" stroke="currentColor" stroke-linecap="round"/>`;
}
// Long step lists show a window around the next open step; the card lists all of them.
function visibleSteps() {
 const steps = stepsFor(current(state.boss));
 const next = Math.max(0, steps.findIndex(task => !task.isDone));
 const start = Math.max(0, Math.min(next - 1, steps.length - maxWaypoints));
 return steps.slice(start, start + maxWaypoints);
}
function drawTrails() {
 const bounds = map.getBoundingClientRect();
 const main = curve(centerOf('buff'), centerOf('boss'), .16), last = curve(centerOf('boss'), centerOf('recovery'), -.18);
 const steps = visibleSteps(), nextOpen = steps.find(task => !task.isDone);
 const ts = [0, ...steps.map((_, i) => .22 + .56 * (i + 1) / (steps.length + 1)), 1];
 const doneFrom = [statusFor('buff') === 'complete', ...steps.map(task => task.isDone)];
 const dotted = 'stroke-width="3" stroke-dasharray="2 9"';
 trails.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
 trails.innerHTML = [
  ...ts.slice(1).map((t, i) => trailPath(main, ts[i], t, `${doneFrom[i] ? 'class="done" ' : ''}${dotted}`)),
  trailPath(last, 0, 1, `${statusFor('boss') === 'complete' ? 'class="done" ' : ''}${dotted}`),
  trailPath(curve(main(.16), centerOf('side'), .1), 0, 1, 'class="branch" stroke-width="2" stroke-dasharray="1 7"')
 ].join('');
 $('waypoints').replaceChildren(...steps.map((task, i) => {
  const dot = document.createElement('span'), point = main(ts[i + 1]);
  dot.className = 'waypoint'; dot.title = task.title;
  dot.dataset.status = task.isDone ? 'complete' : task.id === currentId ? 'active' : task === nextOpen ? 'next' : 'open';
  dot.style.left = point.x + 'px'; dot.style.top = point.y + 'px';
  return dot;
 }));
 placeCard();
}
// Of the spots around the stop, use the one that hides the fewest other stops and waypoints.
// Ties go to the side facing away from the incoming trail, then below, then above.
function placeCard() {
 const panel = $('panel');
 if (!selected) return;
 const gap = 12, box = map.getBoundingClientRect(), node = $('node-' + selected);
 const rel = rect => ({ left: rect.left - box.x, top: rect.top - box.y, right: rect.right - box.x, bottom: rect.bottom - box.y });
 const stop = rel(node.getBoundingClientRect()), orb = rel(node.querySelector('.orb').getBoundingClientRect());
 const width = Math.min(320, box.width - gap * 2);
 panel.style.width = width + 'px';
 const height = panel.offsetHeight, centerX = (orb.left + orb.right) / 2, centerY = (orb.top + orb.bottom) / 2;
 const sideY = Math.max(gap, Math.min(centerY - height / 2, box.height - height - gap));
 const middleX = Math.max(gap, Math.min(centerX - width / 2, box.width - width - gap));
 const right = { x: stop.right + gap, y: sideY }, left = { x: stop.left - gap - width, y: sideY };
 const from = centerOf({ buff: 'boss', boss: 'buff', recovery: 'boss', side: 'buff' }[selected]);
 const spots = [...(from.x < centerX ? [right, left] : [left, right]), { x: middleX, y: stop.bottom + gap }, { x: middleX, y: orb.top - gap - height }]
  .filter(spot => spot.x >= gap - 1 && spot.x + width <= box.width - gap + 1 && spot.y >= gap - 1);
 const obstacles = [...map.querySelectorAll('.stop, .waypoint')].filter(other => other !== node).map(other => rel(other.getBoundingClientRect()));
 // Hanging past the bottom of the map is allowed, but costs a little.
 const cost = spot => obstacles.filter(o => o.left < spot.x + width && o.right > spot.x && o.top < spot.y + height && o.bottom > spot.y).length + (spot.y + height > box.height ? .5 : 0);
 const best = spots.reduce((a, b) => cost(b) < cost(a) ? b : a);
 panel.style.left = best.x + 'px'; panel.style.top = best.y + 'px';
}
new ResizeObserver(drawTrails).observe(map);
$('waypoints').addEventListener('click', event => { if (event.target.closest('.waypoint') && selected !== 'boss') select('boss'); });
// composedPath keeps the original ancestors even when a click re-renders (and detaches) its target.
map.addEventListener('click', event => { if (selected && !event.composedPath().some(node => node instanceof Element && node.matches('.panel, .stop, .waypoint'))) closeDetail(); });

refresh();
if (api?.registerHook) {
 for (const hook of ['taskComplete', 'taskUpdate', 'taskDelete', 'currentTaskChange']) {
  Promise.resolve(api.registerHook(hook, (payload) => {
   if (hook === 'currentTaskChange') { currentId = payload?.current?.id || null; render(); }
   // A change during other work is remembered and loaded once that work is done.
   if (busy) stale = true; else refresh();
  })).catch(() => notify('Live updates unavailable. Reopen Daily Quest to see task changes.'));
 }
}
</script>
